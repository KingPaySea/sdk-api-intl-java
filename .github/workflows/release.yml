name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java 8
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Validate release version
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must use vMAJOR.MINOR.PATCH, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          project_version="$(mvn -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "v${project_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match pom version ${project_version}" >&2
            exit 1
          fi

      - name: Build and verify release artifacts
        run: mvn -B -ntp clean verify

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          final_name="$(mvn -B -ntp help:evaluate -Dexpression=project.build.finalName -q -DforceStdout)"
          release_assets=(
            "target/${final_name}.jar"
            "target/${final_name}-sources.jar"
            "target/${final_name}-javadoc.jar"
            "target/${final_name}-cyclonedx.json"
            "target/${final_name}-cyclonedx.xml"
            "pom.xml"
            "LICENSE"
            "target/checksums/${final_name}.jar.sha256"
            "target/checksums/${final_name}-sources.jar.sha256"
            "target/checksums/${final_name}-javadoc.jar.sha256"
            "target/checksums/${final_name}-cyclonedx.json.sha256"
            "target/checksums/${final_name}-cyclonedx.xml.sha256"
            "target/checksums/pom.xml.sha256"
          )
          for release_asset in "${release_assets[@]}"; do
            test -s "${release_asset}"
          done
          gh release create "${GITHUB_REF_NAME}" "${release_assets[@]}" \
            --verify-tag \
            --title "XPay International Java SDK ${GITHUB_REF_NAME}" \
            --generate-notes
